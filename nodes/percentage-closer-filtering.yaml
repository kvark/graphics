title: Percentage-Closer Filtering
cluster: shadows
year: 1987
aka: [PCF]
summary: >
  Takes several depth comparisons across the shadow map footprint and
  averages the binary results. Filtering the comparisons rather than the
  depths is the key: averaging depths is meaningless.
