title: Rasterization
cluster: geometry
summary: >
  Projects primitives to the screen and fills the pixels they cover. Cost
  scales with primitives times coverage, and visibility comes free from a
  depth buffer.
wikipedia: https://en.wikipedia.org/wiki/Rasterisation
edges:
  - rel: requires
    to: polygon-mesh
    why: it fills projected primitives, not implicit surfaces
  - rel: requires
    to: z-buffer
    why: per-pixel depth is what makes visibility local
