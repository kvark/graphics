title: Mixture of Experts
cluster: efficiency
year: 2017
aka: [MoE]
summary: >
  Routes each token to a few of many expert subnetworks, so parameter
  count grows without the arithmetic growing with it. The routing is the
  hard part, and load balance is a training objective of its own.
