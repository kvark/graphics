title: Whitted Ray Tracing
cluster: light-transport
year: 1980
summary: >
  Recursive ray tracing with perfect mirror reflection, refraction and a
  single shadow ray per light. The first algorithm to get interreflection
  right, and restricted to ideal specular paths.
