title: "Schlick's Approximation"
cluster: materials
year: 1994
summary: >
  Approximates Fresnel reflectance as a fifth-power interpolation between
  normal incidence reflectance and one. Accurate enough for dielectrics
  and cheap enough for a pixel shader.
