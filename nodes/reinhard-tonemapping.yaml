title: Reinhard Tone Mapping
cluster: color
year: 2002
summary: >
  A simple rational curve that maps zero to zero and infinity to one, so
  nothing ever clips. Desaturates highlights and leaves images looking
  flat, but it is the reference everyone starts from.
