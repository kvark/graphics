title: Trust Region Policy Optimization
cluster: reinforcement
year: 2015
aka: [TRPO]
summary: >
  Constrains each update so the KL divergence between the old and new
  policy stays inside a trust region, giving a monotonic improvement
  guarantee at the cost of a second-order solve every step.
