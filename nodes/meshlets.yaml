title: Meshlets and Mesh Shaders
cluster: geometry
summary: >
  Splits a mesh into small vertex-and-triangle clusters that can be culled
  and dispatched independently, replacing the fixed vertex-fetch pipeline
  with a programmable one.
wikipedia: https://en.wikipedia.org/wiki/Shader
edges:
  - rel: extends
    to: rasterization
    why: culls per cluster instead of per triangle or per object
  - rel: requires
    to: simt
    why: a cluster is sized to one workgroup's registers
