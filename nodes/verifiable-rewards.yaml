title: Reinforcement Learning from Verifiable Rewards
cluster: language
year: 2025
aka: [RLVR]
summary: >
  Replaces the learned reward with a programmatic check — does the proof
  verify, do the tests pass, is the answer right. Works only where
  correctness is decidable, and there the signal cannot be gamed.
