title: Spherical Harmonics Irradiance
cluster: real-time-shading
year: 2001
summary: >
  Projects distant lighting onto low-order spherical harmonics. Nine
  coefficients reproduce diffuse irradiance from any environment to within
  a percent, because the cosine lobe is itself a strong low-pass filter.
