title: Bounding Volume Hierarchy
cluster: geometry
aka: [BVH]
summary: >
  A tree of nested bounding boxes over primitives. Handles unevenly
  distributed geometry gracefully, refits cheaply under animation, and is
  what ray tracing hardware implements.
