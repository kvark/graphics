title: Multiple Importance Sampling
cluster: light-transport
year: 1995
aka: [MIS, Balance heuristic]
summary: >
  Combine several sampling strategies by weighting each sample according
  to the probability every strategy would have had of generating it. The
  balance heuristic makes the combination provably near-optimal.
refs:
