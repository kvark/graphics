title: Resampled Importance Sampling
cluster: light-transport
year: 2005
aka: [RIS]
summary: >
  Draw a pool of cheap candidates, then pick one from the pool with
  probability proportional to a better target function. Approximates
  sampling from a distribution you cannot sample from directly.
