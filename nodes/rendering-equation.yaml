title: The Rendering Equation
cluster: foundations
year: 1986
summary: >
  States outgoing radiance at a point as emission plus the integral of
  incoming radiance weighted by the BSDF. Unified the previously separate
  ray tracing and radiosity traditions as approximations of one integral.
