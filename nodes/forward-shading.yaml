title: Forward Shading
cluster: real-time-shading
summary: >
  Shade each fragment as its triangle is rasterized, looping over lights
  inside the shader. Simple and MSAA-friendly, but cost is paid again for
  every fragment later overdrawn.
wikipedia: https://en.wikipedia.org/wiki/Shading
edges:
  - rel: specializes
    to: rasterization
    why: shades each fragment as its triangle is filled
