title: Split-Sum Approximation
cluster: real-time-shading
year: 2013
summary: >
  Factors the specular IBL integral into a prefiltered radiance lookup
  times a precomputed BRDF response table. Both halves fit in textures,
  which is what made physically based specular affordable in real time.
