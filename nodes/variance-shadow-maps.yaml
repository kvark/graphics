title: Variance Shadow Maps
cluster: shadows
year: 2006
aka: [VSM]
summary: >
  Stores depth and squared depth so that Chebyshev's inequality bounds the
  occluded fraction. The map becomes linearly filterable, so it can be
  blurred and mipmapped like an ordinary texture.
