title: Clustered / Tiled Shading
cluster: real-time-shading
year: 2012
summary: >
  Bins lights into screen tiles or view-space froxels so each pixel
  iterates only the lights that can reach it, making thousands of local
  lights affordable.
wikipedia: https://en.wikipedia.org/wiki/Deferred_shading
