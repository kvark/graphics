title: Multiresolution Hash Encoding
cluster: neural
year: 2022
summary: >
  Replaces most of the network's capacity with trainable feature vectors
  in hash tables at several resolutions, so a tiny MLP suffices and
  collisions are resolved by the optimizer rather than avoided.
