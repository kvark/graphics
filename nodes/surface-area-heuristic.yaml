title: Surface Area Heuristic
cluster: geometry
year: 1990
aka: [SAH]
summary: >
  Chooses each split by estimating traversal cost from the probability a
  random ray hits each child, which is proportional to its surface area.
  Still the quality baseline for acceleration structure builds.
refs:
