title: Parallax Occlusion Mapping
cluster: geometry
year: 2006
summary: >
  Ray-marches the height field in tangent space so texture features shift
  with view angle and occlude each other, recovering the parallax that
  normals alone cannot express.
wikipedia: https://en.wikipedia.org/wiki/Parallax_mapping
