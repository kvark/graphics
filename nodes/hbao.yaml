title: Horizon-Based Ambient Occlusion
cluster: real-time-shading
year: 2008
summary: >
  Marches the depth buffer to find the horizon angle in several directions
  and integrates the unoccluded wedge, which is a defensible approximation
  of the occlusion integral rather than a sample count.
