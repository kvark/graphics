title: Batch Normalization
cluster: learning
year: 2015
aka: [BatchNorm]
summary: >
  Normalise each activation across the batch, then rescale by learned
  parameters. Allowed much higher learning rates, which is what made very
  deep networks trainable in practice.
wikipedia: https://en.wikipedia.org/wiki/Batch_normalization
refs:
