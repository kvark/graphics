title: Primary Sample Space MLT
cluster: light-transport
year: 2002
aka: [PSSMLT, Kelemen-style MLT]
summary: >
  Runs the Metropolis chain over the random numbers fed to an ordinary
  path tracer rather than over path space itself, so the mutation
  machinery becomes independent of the underlying integrator.
