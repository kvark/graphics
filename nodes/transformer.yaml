title: Transformer
cluster: sequence-models
year: 2017
summary: >
  Drops recurrence entirely and stacks self-attention with feed-forward
  layers. Because no step waits on the previous one, the whole sequence
  trains in parallel, which is what let model size scale.
wikipedia: https://en.wikipedia.org/wiki/Transformer_(deep_learning)
refs:
